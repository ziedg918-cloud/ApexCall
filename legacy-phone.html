<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Achievement Controller</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 20px;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #080808,
                    #151515,
                    #080808
                );

            color: white;

            min-height: 100vh;

        }


        .container {

            width: 100%;

            max-width: 500px;

            margin: auto;

        }


        h1 {

            text-align: center;

            margin-top: 10px;

            margin-bottom: 10px;

            font-size: 30px;

        }


        .subtitle {

            text-align: center;

            opacity: 0.5;

            margin-bottom: 30px;

            font-size: 15px;

        }


        .card {

            background:
                rgba(
                    30,
                    30,
                    30,
                    0.95
                );

            padding: 20px;

            border-radius: 18px;

            margin-bottom: 20px;

            box-shadow:
                0 10px 30px
                rgba(
                    0,
                    0,
                    0,
                    0.4
                );

        }


        label {

            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            font-size: 16px;

        }


        input,
        select {

            width: 100%;

            padding: 15px;

            border: none;

            outline: none;

            border-radius: 10px;

            font-size: 18px;

            margin-bottom: 18px;

            background: #ffffff;

            color: #111;

        }


        input:focus,
        select:focus {

            box-shadow:
                0 0 0 3px
                rgba(
                    255,
                    215,
                    0,
                    0.25
                );

        }


        button {

            width: 100%;

            padding: 18px;

            border: none;

            border-radius: 12px;

            font-size: 19px;

            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.15s,
                opacity 0.15s;

        }


        button:active {

            transform:
                scale(0.97);

        }


        button:hover {

            opacity: 0.9;

        }


        /* =========================
           SEND BUTTON
        ========================= */

        .send-button {

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #dddddd
                );

            color: #000;

        }


        /* =========================
           STOP BUTTON
        ========================= */

        .stop-button {

            margin-top: 15px;

            background:
                linear-gradient(
                    135deg,
                    #e53935,
                    #b71c1c
                );

            color: white;

        }


        .stop-button:active {

            background:
                #8e1b1b;

        }


        /* =========================
           ADMIN
        ========================= */

        .admin-button {

            background: #333;

            color: white;

        }


        /* =========================
           MESSAGES
        ========================= */

        #message {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            min-height: 20px;

        }


        #stopMessage {

            text-align: center;

            margin-top: 15px;

            font-weight: bold;

            min-height: 20px;

        }


        /* =========================
           AMOUNT
        ========================= */

        #amountContainer {

            display: none;

        }


        /* =========================
           CONNECTION STATUS
        ========================= */

        .connection {

            text-align: center;

            margin-bottom: 20px;

            font-size: 14px;

            opacity: 0.8;

        }


        #connectionStatus {

            font-weight: bold;

        }


        .connected {

            color: #4caf50;

        }


        .disconnected {

            color: #f44336;

        }


        /* =========================
           STOP WARNING
        ========================= */

        .stop-info {

            margin-top: 12px;

            text-align: center;

            font-size: 13px;

            opacity: 0.45;

            line-height: 1.4;

        }

    </style>

</head>


<body>


<div class="container">


    <h1>

        🏆 Achievement Wall

    </h1>


    <div class="subtitle">

        Control the wall from your phone

    </div>


    <!-- CONNECTION STATUS -->

    <div class="connection">

        Server:

        <span
            id="connectionStatus"
            class="disconnected"
        >

            Connecting...

        </span>

    </div>


    <!-- =========================
         ACHIEVEMENT CARD
    ========================= -->


    <div class="card">


        <!-- AGENT NAME -->

        <label>

            Agent Name

        </label>


        <input
            id="agentName"
            type="text"
            placeholder="Example: Haythem"
            autocomplete="off"
        >


        <!-- ACHIEVEMENT -->

        <label>

            Achievement

        </label>


        <select id="achievement">

            <option value="Deposit">

                💰 Deposit

            </option>


            <option value="First Time Deposit">

                🏆 First Time Deposit

            </option>

        </select>


        <!-- =========================
             AMOUNT
        ========================= -->


        <div id="amountContainer">


            <label>

                Deposit Amount ($)

            </label>


            <input
                id="amount"
                type="number"
                min="0"
                step="0.01"
                placeholder="Example: 500"
            >


        </div>


        <!-- =========================
             SEND
        ========================= -->


        <button
            class="send-button"
            onclick="sendAchievement()"
        >

            🚀 SEND ACHIEVEMENT

        </button>


        <div id="message"></div>


        <!-- =========================
             STOP
        ========================= -->


        <button
            class="stop-button"
            onclick="stopCelebration()"
        >

            🔴 STOP CELEBRATION

        </button>


        <div id="stopMessage"></div>


        <div class="stop-info">

            Use this button if an achievement was
            entered incorrectly or you want to
            immediately stop the current celebration.

        </div>


    </div>


    <!-- =========================
         ADMIN
    ========================= -->


    <div class="card">


        <button
            class="admin-button"
            onclick="openAdmin()"
        >

            ⚙️ ADMIN SETTINGS

        </button>


    </div>


</div>


<!-- =========================
     SOCKET.IO
========================= -->


<script
    src="https://cdn.socket.io/4.7.5/socket.io.min.js"
></script>


<script>


    /* =====================================
       SOCKET CONNECTION
    ===================================== */


    const socket = io();


    const connectionStatus =
        document.getElementById(
            "connectionStatus"
        );


    socket.on(
        "connect",
        function() {

            connectionStatus.innerText =
                "Connected";

            connectionStatus.className =
                "connected";

        }
    );


    socket.on(
        "disconnect",
        function() {

            connectionStatus.innerText =
                "Disconnected";

            connectionStatus.className =
                "disconnected";

        }
    );


    /* =====================================
       ELEMENTS
    ===================================== */


    const achievement =
        document.getElementById(
            "achievement"
        );


    const amountContainer =
        document.getElementById(
            "amountContainer"
        );


    /* =====================================
       SHOW / HIDE AMOUNT
    ===================================== */


    achievement.addEventListener(
        "change",
        updateAmountVisibility
    );


    function updateAmountVisibility() {


        if (
            achievement.value ===
            "Deposit"
        ) {

            amountContainer.style.display =
                "block";

        }

        else {

            amountContainer.style.display =
                "none";

        }

    }


    /* =====================================
       INITIAL
    ===================================== */


    updateAmountVisibility();


    /* =====================================
       SEND ACHIEVEMENT
    ===================================== */


    function sendAchievement() {


        const name =
            document.getElementById(
                "agentName"
            ).value.trim();


        const type =
            document.getElementById(
                "achievement"
            ).value;


        const amount =
            document.getElementById(
                "amount"
            ).value;


        const message =
            document.getElementById(
                "message"
            );


        /* =========================
           CHECK CONNECTION
        ========================= */


        if (!socket.connected) {

            message.innerText =
                "❌ Not connected to server.";

            return;

        }


        /* =========================
           CHECK NAME
        ========================= */


        if (!name) {

            message.innerText =
                "❌ Please enter the agent name.";

            return;

        }


        /* =========================
           CHECK AMOUNT
        ========================= */


        if (

            type === "Deposit"

            &&

            (
                !amount
                ||
                Number(amount) <= 0
            )

        ) {

            message.innerText =
                "❌ Please enter the deposit amount.";

            return;

        }


        /* =========================
           CREATE DATA
        ========================= */


        const data = {

            name: name,

            achievement: type,

            amount:

                type === "Deposit"

                    ? Number(amount)

                    : 0

        };


        console.log(
            "Sending achievement:",
            data
        );


        /* =========================
           SEND
        ========================= */


        socket.emit(
            "send_achievement",
            data
        );


        /* =========================
           SUCCESS
        ========================= */


        message.innerText =
            "✅ Achievement sent!";


        /* =========================
           CLEAR FIELDS
        ========================= */


        document.getElementById(
            "agentName"
        ).value = "";


        document.getElementById(
            "amount"
        ).value = "";


        /*
        Automatically return to
        Deposit default.
        */


        document.getElementById(
            "achievement"
        ).value =
            "Deposit";


        updateAmountVisibility();


        /*
        Remove success message
        */


        setTimeout(

            function() {

                message.innerText =
                    "";

            },

            2500

        );

    }


    /* =====================================
       STOP CELEBRATION
    ===================================== */


    function stopCelebration() {


        const stopMessage =
            document.getElementById(
                "stopMessage"
            );


        /* =========================
           CHECK CONNECTION
        ========================= */


        if (!socket.connected) {

            stopMessage.innerText =
                "❌ Not connected to server.";

            return;

        }


        console.log(
            "Sending STOP CELEBRATION"
        );


        /*
        Send stop command to
        Flask-SocketIO server.
        */


        socket.emit(
            "stop_celebration"
        );


        /*
        Show confirmation.
        */


        stopMessage.innerText =
            "🛑 Stop command sent to the wall.";


        /*
        Remove message.
        */


        setTimeout(

            function() {

                stopMessage.innerText =
                    "";

            },

            2500

        );

    }


    /* =====================================
       OPEN ADMIN
    ===================================== */


    function openAdmin() {

        window.location.href =
            "/admin";

    }


    /* =====================================
       ENTER KEY
    ===================================== */


    document
        .getElementById("agentName")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendAchievement();

                }

            }
        );


    document
        .getElementById("amount")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    sendAchievement();

                }

            }
        );


</script>


</body>

</html>
